<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner AulaNFC</title>

  <style>
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f6f9;
      margin:0;
      padding:30px;
      text-align:center;
    }

    h1{
      color:#1976D2;
    }

    .card{
      max-width:420px;
      margin:auto;
      background:white;
      border-radius:15px;
      padding:25px;
      box-shadow:0 4px 15px rgba(0,0,0,.15);
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#1976D2;
      color:white;
      font-size:18px;
      cursor:pointer;
      margin-top:20px;
    }

    button:hover{
      background:#1565C0;
    }

    #estado{
      margin-top:20px;
      font-size:18px;
      color:#444;
    }

    #codigo{
      margin-top:15px;
      font-size:20px;
      font-weight:bold;
      color:#2E7D32;
      word-break:break-word;
    }
  </style>

</head>

<body>

<div class="card">

<h1>📲 Escáner AulaNFC</h1>

<p>Acerca una tarjeta NFC después de activar el lector.</p>

<button onclick="activarNFC()">
Activar escáner NFC
</button>

<div id="estado">
Esperando...
</div>

<div id="codigo"></div>

</div>

<script>

async function activarNFC(){

    if(!("NDEFReader" in window)){
        document.getElementById("estado").innerHTML =
        "❌ Este dispositivo o navegador no es compatible con Web NFC.";
        return;
    }

    try{

        const ndef = new NDEFReader();

        await ndef.scan();

        document.getElementById("estado").innerHTML =
        "✅ Escáner activo. Acerca una tarjeta.";

        ndef.onreading = event => {

            let texto = "";

            if(event.message.records.length>0){

                const record = event.message.records[0];

                if(record.recordType==="text"){

                    texto = new TextDecoder(record.encoding).decode(record.data);

                }else{

                    texto = "Registro NFC leído.";

                }

            }else{

                texto="Tarjeta detectada.";

            }

            document.getElementById("codigo").innerHTML =
            texto;

        };

    }
    catch(error){

        document.getElementById("estado").innerHTML =
        "❌ "+error.message;

    }

}

</script>

</body>
</html>
